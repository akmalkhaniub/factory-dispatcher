[project]
name = "factory-dispatcher"
version = "0.2.0"
description = "Autonomous GitHub Issue-to-PR Dispatcher for Attractor Software Factory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dispatcher"]

[tool.pytest.ini_options]
pythonpath = ["src", "../attractor/src"]
testpaths = ["tests"]
